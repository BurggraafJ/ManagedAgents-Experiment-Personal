<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e4e4e7;
    --muted: #71717a;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --blue: #3b82f6;
    --purple: #a855f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .grid-full { grid-column: 1 / -1; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card-title {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-name { display: flex; align-items: center; gap: 8px; }
  .stat-value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot-yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .dot-red { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .dot-gray { background: var(--muted); }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .badge-green { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge-yellow { background: rgba(234,179,8,0.15); color: var(--yellow); }
  .badge-red { background: rgba(239,68,68,0.15); color: var(--red); }
  .badge-blue { background: rgba(59,130,246,0.15); color: var(--blue); }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .summary-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .summary-number {
    font-size: 2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-bottom: 4px;
  }
  .summary-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .question-item {
    padding: 12px;
    background: rgba(234,179,8,0.05);
    border: 1px solid rgba(234,179,8,0.2);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .question-item:last-child { margin-bottom: 0; }
  .question-skill { font-size: 0.75rem; color: var(--yellow); margin-bottom: 4px; }
  .question-text { font-size: 0.9rem; }
  .error-item {
    padding: 12px;
    background: rgba(239,68,68,0.05);
    border: 1px solid rgba(239,68,68,0.2);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .error-item:last-child { margin-bottom: 0; }
  .error-skill { font-size: 0.75rem; color: var(--red); margin-bottom: 4px; }
  .error-text { font-size: 0.9rem; }
  .timeline {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 60px;
    margin-top: 8px;
  }
  .timeline-bar {
    flex: 1;
    border-radius: 3px 3px 0 0;
    min-height: 4px;
    position: relative;
  }
  .timeline-bar:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
    white-space: nowrap;
    margin-bottom: 4px;
  }
  .timeline-labels {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }
  .timeline-labels span {
    flex: 1;
    text-align: center;
    font-size: 0.65rem;
    color: var(--muted);
  }
  .empty-state {
    text-align: center;
    padding: 40px;
    color: var(--muted);
  }
  .empty-state p { margin-bottom: 8px; }
  .refresh-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(59,130,246,0.4);
    transition: transform 0.2s;
  }
  .refresh-btn:hover { transform: scale(1.1); }
  .refresh-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #file-input { display: none; }
  .load-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    align-items: center;
  }
  .load-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .load-btn:hover { border-color: var(--blue); }
  .auto-label { font-size: 0.75rem; color: var(--muted); }
  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    body { padding: 12px; }
  }
</style>
</head>
<body>

<h1>🤖 Agent Dashboard</h1>
<p class="subtitle" id="last-updated">Geen data geladen — klik op "Laad rapport" of drop een JSON-bestand</p>

<div class="load-bar">
  <button class="load-btn" onclick="document.getElementById('file-input').click()">📂 Laad rapport JSON</button>
  <button class="load-btn" id="auto-btn" onclick="toggleAutoLoad()">⏸ Auto-refresh uit</button>
  <span class="auto-label" id="auto-status"></span>
  <input type="file" id="file-input" accept=".json" onchange="loadFile(event)">
</div>

<div id="dashboard">
  <div class="empty-state">
    <p>🤖</p>
    <p>Nog geen data. Drop een dagrapport JSON-bestand hierheen,<br>of klik op "Laad rapport" om er een te selecteren.</p>
    <p style="font-size:0.75rem; margin-top:12px;">
      Genereer een rapport met:<br>
      <code style="background:var(--card);padding:2px 6px;border-radius:4px;">python compile_report.py /home/user/agent-reports > rapport.json</code>
    </p>
  </div>
</div>

<script>
let autoRefreshInterval = null;
let reportPath = null;

// Drag & drop support
document.body.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
document.body.addEventListener('drop', e => {
  e.preventDefault();
  e.stopPropagation();
  const file = e.dataTransfer.files[0];
  if (file && file.name.endsWith('.json')) {
    readAndRender(file);
  }
});

function loadFile(event) {
  const file = event.target.files[0];
  if (file) readAndRender(file);
}

function readAndRender(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      render(data);
    } catch (err) {
      alert('Kon JSON niet parsen: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function toggleAutoLoad() {
  const btn = document.getElementById('auto-btn');
  const status = document.getElementById('auto-status');
  if (autoRefreshInterval) {
    clearInterval(autoRefreshInterval);
    autoRefreshInterval = null;
    btn.textContent = '⏸ Auto-refresh uit';
    status.textContent = '';
  } else {
    btn.textContent = '▶ Auto-refresh aan';
    status.textContent = 'Elke 60s (alleen bij file:// of lokale server)';
    autoRefreshInterval = setInterval(() => {
      if (reportPath) {
        fetch(reportPath)
          .then(r => r.json())
          .then(render)
          .catch(() => {});
      }
    }, 60000);
  }
}

function statusDot(status) {
  const map = { success: 'dot-green', partial: 'dot-yellow', failed: 'dot-red', inactive: 'dot-red', skipped: 'dot-gray' };
  return `<span class="dot ${map[status] || 'dot-gray'}"></span>`;
}

function statusBadge(status) {
  const map = {
    success: ['badge-green', '✅ OK'],
    partial: ['badge-yellow', '⚠️ Deels'],
    failed: ['badge-red', '❌ Fout'],
    inactive: ['badge-red', '⏹ Inactief'],
    skipped: ['badge-blue', '⏭ Overgeslagen']
  };
  const [cls, label] = map[status] || ['badge-blue', status];
  return `<span class="badge ${cls}">${label}</span>`;
}

function render(data) {
  const d = data;
  const s = d.summary || {};
  const updatedAt = d.generated_at ? new Date(d.generated_at).toLocaleString('nl-NL') : 'onbekend';
  document.getElementById('last-updated').textContent = `Laatst bijgewerkt: ${updatedAt} — ${d.date_display || d.date || ''}`;

  let html = '';

  // Summary cards
  html += `<div class="summary-grid">
    <div class="summary-card">
      <div class="summary-number">${s.total_runs || 0}</div>
      <div class="summary-label">Runs vandaag</div>
    </div>
    <div class="summary-card">
      <div class="summary-number" style="color:var(--green)">${s.total_success || 0}</div>
      <div class="summary-label">Geslaagd</div>
    </div>
    <div class="summary-card">
      <div class="summary-number" style="color:var(--red)">${s.total_failed || 0}</div>
      <div class="summary-label">Gefaald</div>
    </div>
    <div class="summary-card">
      <div class="summary-number">${s.skills_active_today || 0}<span style="color:var(--muted);font-size:1rem">/${s.skills_registered || 0}</span></div>
      <div class="summary-label">Skills actief</div>
    </div>
  </div>`;

  // Questions
  const questions = d.questions || [];
  if (questions.length > 0) {
    html += `<div class="card" style="margin-bottom:16px;border-color:rgba(234,179,8,0.3)">
      <div class="card-title">🙋 Vragen die wachten (${questions.length})</div>`;
    questions.forEach(q => {
      html += `<div class="question-item">
        <div class="question-skill">${q.skill || 'onbekend'} — ${q.priority || ''}</div>
        <div class="question-text">${q.question || ''}</div>
        ${q.options ? `<div style="margin-top:6px;font-size:0.8rem;color:var(--muted)">Opties: ${q.options.join(' · ')}</div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  // Errors
  const errors = (d.errors || []).filter(e => e.severity === 'critical');
  if (errors.length > 0) {
    html += `<div class="card" style="margin-bottom:16px;border-color:rgba(239,68,68,0.3)">
      <div class="card-title">🚨 Kritieke fouten (${errors.length})</div>`;
    errors.forEach(e => {
      const time = e.run_time ? new Date(e.run_time).toLocaleTimeString('nl-NL', {hour:'2-digit',minute:'2-digit'}) : '';
      html += `<div class="error-item">
        <div class="error-skill">${e.skill || 'onbekend'} ${time ? '— ' + time : ''}</div>
        <div class="error-text">${e.message || ''}</div>
        ${e.context ? `<div style="margin-top:4px;font-size:0.8rem;color:var(--muted)">${e.context}</div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  // Skills grid
  html += `<div class="grid">`;

  // Per-skill cards
  const skills = d.skills || [];
  skills.forEach(sk => {
    const healthIcon = sk.health_ok ? '💚' : '🔴';
    html += `<div class="card">
      <div class="card-title">${statusDot(sk.overall_status)} ${sk.display_name || sk.skill}</div>
      <div class="stat-row">
        <span class="stat-name">Runs vandaag</span>
        <span class="stat-value">${sk.runs_today}</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">Status</span>
        <span>${statusBadge(sk.overall_status)}</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">${sk.primary_metric_label || 'Metric'}</span>
        <span class="stat-value">${sk.primary_metric_total}</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">Health</span>
        <span>${sk.health_ok ? '<span class="badge badge-green">Gezond</span>' : '<span class="badge badge-red">' + (sk.health_issue || 'Issue') + '</span>'}</span>
      </div>
      <div class="stat-row">
        <span class="stat-name">Schedule</span>
        <span style="font-size:0.8rem;color:var(--muted)">${sk.schedule || '—'}</span>
      </div>
      ${sk.next_scheduled ? `<div class="stat-row">
        <span class="stat-name">Volgende run</span>
        <span style="font-size:0.8rem">${new Date(sk.next_scheduled).toLocaleTimeString('nl-NL', {hour:'2-digit',minute:'2-digit'})}</span>
      </div>` : ''}
    </div>`;
  });

  html += `</div>`;

  // Week chart
  const week = d.week_summary || [];
  if (week.length > 0) {
    const maxRuns = Math.max(...week.map(w => w.total), 1);
    html += `<div class="card">
      <div class="card-title">📈 Week overzicht</div>
      <div class="timeline">`;
    week.forEach(w => {
      const h = Math.max((w.total / maxRuns) * 100, 5);
      const failPct = w.total > 0 ? (w.failed / w.total) * 100 : 0;
      const color = failPct > 20 ? 'var(--red)' : failPct > 0 ? 'var(--yellow)' : 'var(--green)';
      const tooltip = `${w.day_name}: ${w.total} runs (${w.success}✅ ${w.failed}❌)`;
      html += `<div class="timeline-bar" style="height:${h}%;background:${color};${w.is_today ? 'opacity:1;box-shadow:0 0 8px ' + color : 'opacity:0.7'}" data-tooltip="${tooltip}"></div>`;
    });
    html += `</div><div class="timeline-labels">`;
    week.forEach(w => {
      html += `<span style="${w.is_today ? 'color:var(--text);font-weight:600' : ''}">${w.day_name}${w.is_today ? ' ←' : ''}</span>`;
    });
    html += `</div></div>`;
  }

  document.getElementById('dashboard').innerHTML = html;
}

// Auto-detect rapport.json in same directory
fetch('rapport.json')
  .then(r => { if (r.ok) return r.json(); throw new Error('not found'); })
  .then(data => { reportPath = 'rapport.json'; render(data); })
  .catch(() => {});
</script>

</body>
</html>
